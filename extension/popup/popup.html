<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nina</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">NINA</span>
    <span class="sub">Microsoft Neural TTS</span>
  </div>

  <div class="section">
    <label>Default voice</label>
    <select id="voiceSel"></select>
    <span id="voiceNote" class="note"></span>
  </div>

  <div class="section">
    <label>Default speed</label>
    <select id="rateSel">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </div>

  <div class="section row">
    <button id="injectBtn" class="btn-primary">▶ Read This Page</button>
  </div>

  <div class="footer">
    Ctrl+Shift+U toggles on any page
  </div>

  <script src="popup.js"></script>
</body>
</html>
